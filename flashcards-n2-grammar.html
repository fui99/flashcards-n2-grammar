<script>
var CARDS=[
["〜げ / 〜たげ","Trông có vẻ…","<ruby>彼<rt>かれ</rt></ruby>は<ruby>先生<rt>せんせい</rt></ruby>に<ruby>対<rt>たい</rt></ruby>し<ruby>何<rt>なに</rt></ruby>か<ruby>言<rt>い</rt></ruby>いたげな<ruby>様子<rt>ようす</rt></ruby>であった。","Anh ấy có vẻ như muốn nói điều gì đó với thầy.","<b>Chú ý:</b> 〜げ gắn vào gốc tính từ (うれしげ), 〜たげ gắn vào V たい. Chỉ dùng để đoán trạng thái của <b>người khác</b>, không dùng cho bản thân. Khác với 〜そうだ (cũng là 'có vẻ')."],
["普通形 + とか","Thấy bảo hình như là…","<ruby>最近<rt>さいきん</rt></ruby>は<ruby>若者<rt>わかもの</rt></ruby>にタピオカという<ruby>飲<rt>の</rt></ruby>み<ruby>物<rt>もの</rt></ruby>が<ruby>人気<rt>にんき</rt></ruby>だとか。","Nghe nói gần đây giới trẻ đang chuộng một loại đồ uống gọi là trà sữa trân châu.","<b>Chú ý:</b> Diễn đạt tin đồn, thông tin nghe được, không chắc chắn. Dùng trong văn nói thân mật. Trang trọng hơn thì dùng とのことだ."],
["V ていく／てくる","Làm gì rồi di chuyển / trạng thái liên tục / thay đổi dần / hướng hành động","これからは<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>するベトナム<ruby>人<rt>じん</rt></ruby>が<ruby>増<rt>ふ</rt></ruby>えていくだろう。","Từ nay về sau, số người Việt Nam học tiếng Nhật chắc sẽ ngày càng tăng.","<b>Chú ý:</b> Phân biệt hướng từ điểm nhìn người nói: てくる = về phía người nói / kéo dài đến hiện tại, ていく = xa dần / tiếp diễn về tương lai. Đề thi rất hay hỏi phân biệt cặp này."],
["V ます + がたい","Không thể nào mà… / Khó mà…","この<ruby>番組<rt>ばんぐみ</rt></ruby>は<ruby>間違<rt>まちが</rt></ruby>った<ruby>情報<rt>じょうほう</rt></ruby>を<ruby>発信<rt>はっしん</rt></ruby>しているので<ruby>信<rt>しん</rt></ruby>じがたい。","Vì chương trình này đang phát đi những thông tin sai lệch nên khó mà tin được.","<b>Chú ý:</b> Mang tính văn viết, trang trọng. Không dùng cho cảm xúc cá nhân đơn giản; trong văn nói thường dùng 難しい thay thế."],
["かと思うと / V た + かと思ったら","Vừa mới… đã ngay lập tức…","<ruby>仕事<rt>しごと</rt></ruby>が<ruby>一段落<rt>いちだんらく</rt></ruby>したかと<ruby>思<rt>おも</rt></ruby>うと、またすぐに<ruby>別<rt>べつ</rt></ruby>の<ruby>仕事<rt>しごと</rt></ruby>を<ruby>任<rt>まか</rt></ruby>された。","Công việc vừa mới tạm xong một đoạn thì tôi đã ngay lập tức được giao việc khác.","<b>Chú ý:</b> Hai sự việc xảy ra gần như đồng thời, sự việc sau mang tính bất ngờ. Không dùng với hành động có ý chí của người nói."],
["V る／V た + か + V ない + かのうちに","Ngay khi vừa mới… thì…","<ruby>息子<rt>むすこ</rt></ruby>はベッドに<ruby>入<rt>はい</rt></ruby>るか<ruby>入<rt>はい</rt></ruby>らないかのうちに<ruby>寝<rt>ね</rt></ruby>てしまった。","Con trai tôi vừa mới đặt mình lên giường thì đã ngủ mất rồi.","<b>Chú ý:</b> Nhấn mạnh sự việc sau xảy ra ngay khi sự việc trước vừa hoàn thành. Chỉ dùng cho hành động chớp nhoáng, không dùng cho quá trình dài."],
["V 普通形 + だけあって","Quả nhiên là vì… nên","10<ruby>年<rt>ねん</rt></ruby><ruby>日本<rt>にほん</rt></ruby>に<ruby>住<rt>す</rt></ruby>んでるだけあって、<ruby>発音<rt>はつおん</rt></ruby>がとても<ruby>自然<rt>しぜん</rt></ruby>だ。","Quả nhiên là vì sống ở Nhật 10 năm nên phát âm rất tự nhiên.","<b>Chú ý:</b> Vế sau là kết quả <b>tương xứng, tích cực</b> (ngưỡng mộ, khen ngợi). Đừng nhầm với だけに (vế sau có thể tích cực hoặc tiêu cực)."],
["V(普)/A い(普)/A な(である) + だけに","Chính bởi… thế nên là…","この<ruby>物件<rt>ぶっけん</rt></ruby>は<ruby>安<rt>やす</rt></ruby>いだけに<ruby>何<rt>なに</rt></ruby>かあるのではないかと<ruby>不安<rt>ふあん</rt></ruby>になる。","Chính bởi căn nhà này rẻ nên tôi lại càng thấy bất an, sợ có vấn đề gì đó.","<b>Chú ý:</b> Nhấn mạnh 'chính vì… nên càng…', vế sau có thể tích cực HOẶC tiêu cực. So với だけあって (vế sau chỉ tích cực)."],
["V ば / A いければ / A なであれば + こそ","Chính vì… nên mới…","<ruby>忙<rt>いそが</rt></ruby>しければこそ、<ruby>自分<rt>じぶん</rt></ruby>で<ruby>工夫<rt>くふう</rt></ruby>して<ruby>時間<rt>じかん</rt></ruby>を<ruby>作<rt>つく</rt></ruby>る。","Chính vì bận nên mới phải tự tìm cách xoay xở để tạo ra thời gian.","<b>Chú ý:</b> Nhấn mạnh lý do duy nhất, mang sắc thái văn viết hơi cổ. V ばこそ / A ければこそ."],
["普通形 + ばかりに","Chỉ vì… mà…","<ruby>財布<rt>さいふ</rt></ruby>を<ruby>忘<rt>わす</rt></ruby>れたばかりに、<ruby>電車<rt>でんしゃ</rt></ruby>に<ruby>乗<rt>の</rt></ruby>ることができず<ruby>遅刻<rt>ちこく</rt></ruby>してしまった。","Chỉ vì quên ví mà tôi không lên được tàu điện, cuối cùng bị muộn.","<b>Chú ý:</b> Vế sau luôn là kết quả <b>TIÊU CỰC</b> do nguyên nhân ở vế trước gây ra. Nếu kết quả tích cực thì dùng だけあって."],
["V る + ものだ / V ない","Vốn dĩ là… / Là đương nhiên…","<ruby>人前<rt>ひとまえ</rt></ruby>で<ruby>演説<rt>えんぜつ</rt></ruby>する<ruby>時<rt>とき</rt></ruby>は、<ruby>誰<rt>だれ</rt></ruby>でも<ruby>緊張<rt>きんちょう</rt></ruby>するものだ。","Khi thuyết trình trước đám đông thì ai cũng hồi hộp cả, đó là điều đương nhiên.","<b>Chú ý:</b> Diễn tả chân lý, lẽ thường trong xã hội. Đi với V る / V ない. Đừng nhầm với ものだ nghĩa cảm thán."],
["V る + ものではない","Nên / Không nên…","<ruby>知<rt>し</rt></ruby>らない<ruby>人<rt>ひと</rt></ruby>の<ruby>話<rt>はなし</rt></ruby>を<ruby>簡単<rt>かんたん</rt></ruby>に<ruby>信用<rt>しんよう</rt></ruby>するものではない。","Không nên dễ dàng tin lời của người lạ.","<b>Chú ý:</b> Lời khuyên răn mang tính đạo đức, xã hội ('không nên'), mạnh hơn ないほうがいい."],
["V(普)/A い(普)/A な + ものだ","Thật là… biết bao / Quả là… biết bao","<ruby>一度<rt>いちど</rt></ruby>にあれほど<ruby>多<rt>おお</rt></ruby>くの<ruby>服<rt>ふく</rt></ruby>を<ruby>買<rt>か</rt></ruby>うなんて<ruby>贅沢<rt>ぜいたく</rt></ruby>なものだな。","Mua nhiều quần áo đến thế trong một lần thì quả là xa xỉ biết bao.","<b>Chú ý:</b> Diễn tả cảm xúc mạnh của người nói. Hay đi với な / なあ cuối câu. Khác hẳn ものだ nghĩa 'vốn dĩ'."],
["V 普 / A い / A な + というものだ","Thật là, đúng là…","<ruby>女性<rt>じょせい</rt></ruby>に<ruby>年齢<rt>ねんれい</rt></ruby>を<ruby>聞<rt>き</rt></ruby>くのはタブーというものだ。","Hỏi tuổi phụ nữ đúng là điều cấm kỵ.","<b>Chú ý:</b> Khẳng định mạnh 'đúng là…', mang tính đánh giá chung được xã hội công nhận."],
["V(普)/A い(普)/A な(である) + ものの","Mặc dù… nhưng… / …thế mà…","せっかくマフラーを<ruby>編<rt>あ</rt></ruby>んだものの、<ruby>彼<rt>かれ</rt></ruby>に<ruby>渡<rt>わた</rt></ruby>すチャンスがなかった。","Dù đã cất công đan chiếc khăn quàng, nhưng tôi lại không có cơ hội trao cho anh ấy.","<b>Chú ý:</b> Vế sau là kết quả trái với kỳ vọng. Trang trọng hơn けど / のに."],
["V る + ものなら (可能形)","Nếu như có thể…","<ruby>学生時代<rt>がくせいじだい</rt></ruby>に<ruby>戻<rt>もど</rt></ruby>れるものなら、<ruby>真面目<rt>まじめ</rt></ruby>に<ruby>勉強<rt>べんきょう</rt></ruby>をしたい。","Nếu có thể quay lại thời sinh viên, tôi muốn học hành thật nghiêm túc.","<b>Chú ý:</b> Đi với động từ thể khả năng, diễn tả ước muốn khó thành hiện thực."],
["普通形 + というものでは(も)ない","Tôi nghĩ rằng không hẳn là…","<ruby>結婚<rt>けっこん</rt></ruby>したからといって<ruby>幸<rt>しあわ</rt></ruby>せだというものでもない。","Tôi nghĩ rằng không hẳn cứ kết hôn là sẽ hạnh phúc.","<b>Chú ý:</b> Phủ định một nhận định chung ('không hẳn là…'). Hay đi với からといって."],
["V る／A い + ものがある / A な","Có điều gì đó cảm thấy rất…","<ruby>彼<rt>かれ</rt></ruby>の<ruby>演説<rt>えんぜつ</rt></ruby>は<ruby>何<rt>なに</rt></ruby>か<ruby>人<rt>ひと</rt></ruby>の<ruby>心<rt>こころ</rt></ruby>を<ruby>動<rt>うご</rt></ruby>かすものがある。","Bài diễn thuyết của anh ấy có điều gì đó lay động lòng người.","<b>Chú ý:</b> Diễn tả ấn tượng, cảm nhận sâu sắc về sự vật. Thường đi với なにか / 何か."],
["V る + ことになる / ことになっている","Sẽ, phải, đã được quyết định…","この<ruby>図書館<rt>としょかん</rt></ruby>は<ruby>休日<rt>きゅうじつ</rt></ruby>は8<ruby>時<rt>じ</rt></ruby>で<ruby>閉館<rt>へいかん</rt></ruby>することになっている。","Thư viện này đã được quyết định là ngày nghỉ sẽ đóng cửa lúc 8 giờ.","<b>Chú ý:</b> Quyết định do người khác/tổ chức đưa ra, không phải ý chí người nói. Khác với ことにする (tự mình quyết định). Bẫy đề thi kinh điển!"],
["V る + ことなく","Mà không…","<ruby>弟<rt>おとうと</rt></ruby>は<ruby>休<rt>やす</rt></ruby>むことなく<ruby>必死<rt>ひっし</rt></ruby>に<ruby>勉強<rt>べんきょう</rt></ruby>をしていた。","Em trai tôi học hành chăm chỉ mà không nghỉ ngơi chút nào.","<b>Chú ý:</b> = ないで nhưng mang tính văn viết, trang trọng. Dùng để nối hai hành động."],
["V た / A な / A お + ことに","Thật là… / Biết bao khi…","<ruby>困<rt>こま</rt></ruby>ったことに、<ruby>携帯<rt>けいたい</rt></ruby>の<ruby>充電<rt>でん</rt></ruby>がなくなってしまい<ruby>連絡手段<rt>れんらくしゅだん</rt></ruby>がなくなる。","Thật khổ là điện thoại hết pin, mất luôn phương tiện liên lạc.","<b>Chú ý:</b> Đứng đầu câu cảm thán, diễn tả cảm xúc của người nói về sự việc."],
["普通形 + ことから","Vì là có việc… / Bởi…","<ruby>日本<rt>にほん</rt></ruby>に<ruby>興味<rt>きょうみ</rt></ruby>を<ruby>持<rt>も</rt></ruby>ったことから、<ruby>日本<rt>にほん</rt></ruby>に<ruby>留学<rt>りゅうがく</rt></ruby>することを<ruby>決意<rt>けつい</rt></ruby>した。","Vì có hứng thú với Nhật Bản nên tôi đã quyết tâm đi du học Nhật.","<b>Chú ý:</b> Chỉ nguyên nhân, khởi nguồn khách quan của sự việc."],
["N の + ことだから","Vì là… nên chắc chắn","<ruby>彼女<rt>かのじょ</rt></ruby>のことだから、すぐに<ruby>友達<rt>ともだち</rt></ruby>ができるだろう。","Vì là cô ấy nên chắc chắn sẽ nhanh chóng kết bạn được thôi.","<b>Chú ý:</b> Dựa vào hiểu biết về người/vật đó để suy đoán chắc chắn."],
["V ない + ことには","Nếu không… thì…","<ruby>実際<rt>じっさい</rt></ruby>に<ruby>見<rt>み</rt></ruby>てみないことには、<ruby>判断<rt>はんだん</rt></ruby>することはできない。","Nếu không tận mắt xem thì không thể đánh giá được.","<b>Chú ý:</b> Điều kiện bắt buộc: 'nếu không… thì không…'. Vế sau thường là phủ định."],
["V る + ことはない","Không cần phải ~","<ruby>安全<rt>あんぜん</rt></ruby>に<ruby>運転<rt>うんてん</rt></ruby>するから、<ruby>心配<rt>しんぱい</rt></ruby>することはない。","Vì tôi lái xe an toàn nên không cần phải lo lắng.","<b>Chú ý:</b> Dùng để trấn an 'không cần phải…'. Khác với はずがない (chắc chắn không)."],
["V る / V ない + こと","Hãy, phải… / Không được…","<ruby>目上<rt>めうえ</rt></ruby>の<ruby>人<rt>ひと</rt></ruby>には<ruby>常<rt>つね</rt></ruby>に<ruby>敬意<rt>けいい</rt></ruby>を<ruby>持<rt>も</rt></ruby>って<ruby>接<rt>せっ</rt></ruby>すること。","Hãy luôn đối xử với người trên bằng sự kính trọng.","<b>Chú ý:</b> Cách ra mệnh lệnh gián tiếp, trang trọng. Thường thấy trong nội quy, hướng dẫn, biển báo."],
["V る・V ない + ことだ","Nên / Không nên","<ruby>身体<rt>しんたい</rt></ruby>の<ruby>健康<rt>けんこう</rt></ruby>を<ruby>気遣<rt>きづか</rt></ruby>うのであれば、<ruby>野菜<rt>やさい</rt></ruby>を<ruby>食<rt>た</rt></ruby>べることだ。","Nếu quan tâm đến sức khỏe thì nên ăn rau.","<b>Chú ý:</b> Lời khuyên nên/không nên. Nhẹ hơn べきだ (mang tính nghĩa vụ, bắt buộc)."],
["A い / A な + ことだ","Vô cùng, rất ~","<ruby>屋根<rt>やね</rt></ruby>から<ruby>落<rt>お</rt></ruby>ちるなんて<ruby>大変<rt>たいへん</rt></ruby>なことだ。","Ngã từ mái nhà xuống thì nguy hiểm vô cùng.","<b>Chú ý:</b> A + ことだ diễn tả mức độ cao. Hay đi với 大変な / たいした."],
["普通形 + ことか","Thật là, biết bao nhiêu ~","<ruby>彼<rt>かれ</rt></ruby>の<ruby>行動<rt>こうどう</rt></ruby>によって、どれだけの<ruby>命<rt>いのち</rt></ruby>が<ruby>救<rt>すく</rt></ruby>われたことか。","Nhờ hành động của anh ấy mà biết bao sinh mạng đã được cứu.","<b>Chú ý:</b> Cảm thán 'biết bao', thường đi với どれだけ / なんと."],
["V(ない)/A いく/A なで/N で + ないことは(も)ない","Không phải là không… / Có lẽ, có thể là…","それは<ruby>私<rt>わたし</rt></ruby>のせいでないことはないけど、<ruby>上司<rt>じょうし</rt></ruby>に<ruby>言<rt>い</rt></ruby>われてやっただけだ。","Không phải là tôi không có lỗi trong chuyện đó, nhưng tôi chỉ làm theo lời sếp bảo thôi.","<b>Chú ý:</b> Phủ định của phủ định = khẳng định yếu. Dùng khi dè dặt thừa nhận điều gì đó."],
["V/A い(普通形)/A な(である)/N(である) + ことだし","Vì, bởi vì… nên","<ruby>仕事<rt>しごと</rt></ruby>も<ruby>済<rt>す</rt></ruby>んだことだし、<ruby>一杯<rt>いっぱい</rt></ruby><ruby>飲<rt>の</rt></ruby>みにいこうよ。","Việc cũng xong rồi, đi làm một ly đi.","<b>Chú ý:</b> Đưa ra lý do rồi đề xuất hành động. Văn nói thân mật."],
["A い / A な + かぎりだ","Cảm thấy rất / vô cùng ~","あのレストランが<ruby>来月<rt>らいげつ</rt></ruby>で<ruby>閉店<rt>へいてん</rt></ruby>だなんて<ruby>残念<rt>ざんねん</rt></ruby>な<ruby>限<rt>かぎ</rt></ruby>りだ。","Nhà hàng đó mà đóng cửa từ tháng sau thì tiếc vô cùng.","<b>Chú ý:</b> Diễn tả cảm xúc mãnh liệt, thường là tiêu cực. Đi với tính từ."],
["N + に限らず","Không chỉ… mà còn…","ここの<ruby>店<rt>みせ</rt></ruby>は、<ruby>休日<rt>きゅうじつ</rt></ruby>に<ruby>限<rt>かぎ</rt></ruby>らず<ruby>平日<rt>へいじつ</rt></ruby>も<ruby>大勢<rt>おおぜい</rt></ruby>の<ruby>人<rt>ひと</rt></ruby>が<ruby>訪<rt>おとず</rt></ruby>れる。","Cửa hàng này không chỉ ngày nghỉ mà ngày thường cũng đông khách.","<b>Chú ý:</b> Mở rộng phạm vi liệt kê. Đừng nhầm với に限って (giới hạn, loại trừ)."],
["N の + 限り(では)","Trong phạm vi… / Ở mức độ…","<ruby>私<rt>わたし</rt></ruby>の<ruby>知<rt>し</rt></ruby>る<ruby>限<rt>かぎ</rt></ruby>り、あの<ruby>男<rt>おとこ</rt></ruby>は<ruby>事件<rt>じけん</rt></ruby>の<ruby>犯人<rt>はんにん</rt></ruby>ではない。","Trong phạm vi tôi biết thì người đàn ông đó không phải thủ phạm vụ án.","<b>Chú ý:</b> Giới hạn phạm vi hiểu biết, nhận định của người nói."],
["A い / V(普) + 限り(は)","Trong lúc… / Khi…","<ruby>日本<rt>にほん</rt></ruby>に<ruby>住<rt>す</rt></ruby>んでいる<ruby>限<rt>かぎ</rt></ruby>り、<ruby>日本<rt>にほん</rt></ruby>のルールを<ruby>守<rt>まも</rt></ruby>らなければならない。","Chừng nào còn sống ở Nhật thì phải tuân thủ luật lệ của Nhật.","<b>Chú ý:</b> Điều kiện duy trì: 'chừng nào còn… thì…'. Vế sau thường là nghĩa vụ."],
["N に限り… / N に限る","Chỉ trong / Chỉ đối với / Chỉ riêng ~","<ruby>毎月<rt>まいつき</rt></ruby>、<ruby>第一金曜日<rt>だいいちきんようび</rt></ruby>に<ruby>限<rt>かぎ</rt></ruby>り、1000<ruby>円<rt>えん</rt></ruby>で<ruby>映画<rt>えいが</rt></ruby>が<ruby>鑑賞<rt>かんしょう</rt></ruby>できる。","Chỉ riêng thứ Sáu đầu tiên mỗi tháng mới được xem phim với giá 1000 yên.","<b>Chú ý:</b> Giới hạn đối tượng, thời gian đặc biệt."],
["N + に限って","① Ai chứ, gì chứ ~ ② Đúng vào lúc ~","あの<ruby>人<rt>ひと</rt></ruby>に<ruby>限<rt>かぎ</rt></ruby>って、<ruby>寝坊<rt>ねぼう</rt></ruby>するなんて、<ruby>何<rt>なに</rt></ruby>かあったに<ruby>違<rt>ちが</rt></ruby>いない。","Người như anh ấy mà lại ngủ quên thì chắc chắn đã có chuyện gì đó.","<b>Chú ý:</b> 2 nghĩa: ① 'người như… mà lại' (bất ngờ tiêu cực) ② 'đúng vào lúc…' (trùng hợp xui xẻo). Đừng nhầm với に限らず."],
["V る・ない / N + に限る","~ là tốt nhất","ダイエットは<ruby>食事制限<rt>しょくじせいげん</rt></ruby>をするより、<ruby>運動<rt>うんどう</rt></ruby>に<ruby>限<rt>かぎ</rt></ruby>る。","Giảm cân thì vận động là tốt nhất, hơn là kiêng ăn.","<b>Chú ý:</b> Đưa ra kết luận 'là tốt nhất' sau khi so sánh các lựa chọn."],
["V る + まい","① sẽ không ② có lẽ không","<ruby>毎回<rt>まいかい</rt></ruby><ruby>誘<rt>さそ</rt></ruby>っても<ruby>断<rt>ことわ</rt></ruby>られるので、<ruby>二度<rt>にど</rt></ruby>と<ruby>誘<rt>さそ</rt></ruby>うまい。","Lần nào rủ cũng bị từ chối nên tôi sẽ không rủ nữa.","<b>Chú ý:</b> ① ý chí phủ định 'sẽ không' (ngôi thứ nhất) ② suy đoán phủ định 'chắc là không'. Mang tính văn viết. Thể: V ない→まい (する→すまい, 来る→来まい)."],
["V ようか / V るまいか","Làm… hay là không…","<ruby>春休<rt>はるやす</rt></ruby>みに、<ruby>実家<rt>じっか</rt></ruby>に<ruby>帰省<rt>きせい</rt></ruby>しようか、するまいか、<ruby>考<rt>かんが</rt></ruby>えている。","Tôi đang nghĩ xem kỳ nghỉ xuân nên về quê hay không.","<b>Chú ý:</b> Diễn tả sự phân vân 'làm hay không làm'. Đi với か."],
["N1 にしろ N2 にしろ","Dù… dù…","<ruby>進学<rt>しんがく</rt></ruby>にしろ、<ruby>就職<rt>しゅうしょく</rt></ruby>にしろ、<ruby>自分<rt>じぶん</rt></ruby>の<ruby>将来<rt>しょうらい</rt></ruby>なのでしっかりと<ruby>考<rt>かんが</rt></ruby>える。","Dù là học tiếp hay đi làm thì cũng là tương lai của mình nên phải suy nghĩ kỹ.","<b>Chú ý:</b> Liệt kê hai khả năng đối lập, kết luận chung ở vế sau."],
["V/A い(普通形)/A な/N(である) + にせよ～にせよ","Cho dù, dù cho, ngay cả…","パーティーに<ruby>行<rt>い</rt></ruby>くにせよ<ruby>行<rt>い</rt></ruby>かないにせよ、<ruby>早<rt>はや</rt></ruby>く<ruby>決<rt>き</rt></ruby>めてくれないか？","Cho dù đi dự tiệc hay không thì quyết định nhanh giúp tôi được không?","<b>Chú ý:</b> Giống にしろ nhưng trang trọng hơn, dùng trong văn viết."],
["V る + V ない / N + にかかわらず","Bất kể…","<ruby>田舎<rt>いなか</rt></ruby>のバスは<ruby>距離<rt>きょり</rt></ruby>にかかわらず、<ruby>金額<rt>きんがく</rt></ruby>は<ruby>一律<rt>いちりつ</rt></ruby>だ。","Xe buýt ở quê thì bất kể quãng đường, giá vé đều như nhau.","<b>Chú ý:</b> Vế trước là cặp đối lập (có/không, đi/không đi) hoặc danh từ. Khác với にもかかわらず (mặc dù)."],
["普通形 + にもかかわらず","Mặc dù… / Cho dù…","<ruby>徹夜<rt>てつや</rt></ruby>して<ruby>勉強<rt>べんきょう</rt></ruby>したにもかかわらず、テストの<ruby>結果<rt>けっか</rt></ruby>は<ruby>良<rt>よ</rt></ruby>くなかった。","Mặc dù đã thức trắng đêm học bài nhưng kết quả bài kiểm tra lại không tốt.","<b>Chú ý:</b> Kết quả trái với kỳ vọng. Trang trọng hơn のに. Đừng nhầm với にかかわらず (bất kể)."],
["V る / N + につけ","Cứ mỗi khi… / Lúc nào cũng, cái gì cũng…","あの<ruby>音楽<rt>おんがく</rt></ruby>を<ruby>聴<rt>き</rt></ruby>くにつけ、<ruby>新婚<rt>しんこん</rt></ruby>の<ruby>頃<rt>ころ</rt></ruby>を<ruby>思<rt>おも</rt></ruby>い<ruby>出<rt>だ</rt></ruby>す。","Cứ mỗi lần nghe bản nhạc đó là tôi lại nhớ về thời mới cưới.","<b>Chú ý:</b> Mỗi lần tiếp xúc với sự vật là cảm xúc, ký ức lại ùa về."],
["N + に反して / に反する","Trái với… / Ngược lại với…","<ruby>彼女<rt>かのじょ</rt></ruby>は<ruby>周囲<rt>しゅうい</rt></ruby>の<ruby>期待<rt>きたい</rt></ruby>に<ruby>反<rt>はん</rt></ruby>して<ruby>大学<rt>だいがく</rt></ruby>を<ruby>中退<rt>ちゅうたい</rt></ruby>し、<ruby>歌手<rt>かしゅ</rt></ruby>を<ruby>目指<rt>めざ</rt></ruby>し<ruby>始<rt>はじ</rt></ruby>めた。","Trái với kỳ vọng của mọi người xung quanh, cô ấy đã bỏ đại học giữa chừng và bắt đầu theo đuổi con đường ca sĩ.","<b>Chú ý:</b> Kết quả ngược với kỳ vọng, dự đoán."],
["N + に応じて / に応じた","Tùy theo… / Tương ứng với…","<ruby>言語<rt>げんご</rt></ruby>レベルに<ruby>応<rt>おう</rt></ruby>じて、クラス<ruby>分<rt>わ</rt></ruby>けを<ruby>行<rt>おこな</rt></ruby>う。","Việc chia lớp được thực hiện tùy theo trình độ ngôn ngữ.","<b>Chú ý:</b> Sự thay đổi tương ứng giữa hai yếu tố."],
["N + に加えて","Thêm vào đó nữa là… / Không chỉ… mà… cũng…","<ruby>明日<rt>あした</rt></ruby>は<ruby>大雨<rt>おおあめ</rt></ruby>に<ruby>加<rt>くわ</rt></ruby>えて<ruby>風<rt>かぜ</rt></ruby>も<ruby>強<rt>つよ</rt></ruby>く、ひどい<ruby>天気<rt>てんき</rt></ruby>になるらしい。","Nghe nói ngày mai ngoài mưa lớn ra gió cũng mạnh, thời tiết sẽ rất tệ.","<b>Chú ý:</b> Bổ sung thông tin cùng chiều với vế trước (thường là tiêu cực trong ví dụ)."],
["数量詞 / N + につき","Cứ mỗi… / Vì, do…","この<ruby>駐車場<rt>ちゅうしゃじょう</rt></ruby>は<ruby>一時間<rt>いちじかん</rt></ruby>につき800<ruby>円<rt>えん</rt></ruby>となります。","Bãi đỗ xe này tính 800 yên cho mỗi giờ.","<b>Chú ý:</b> 2 nghĩa: ① 'mỗi…' (đơn vị tính) ② 'vì…' (lý do, văn viết trang trọng)."],
["N + に基づいて / に基づく","Dựa theo… / Dựa trên…","<ruby>経験<rt>けいけん</rt></ruby>に<ruby>基<rt>もと</rt></ruby>づいて<ruby>確<rt>たし</rt></ruby>かな<ruby>判断<rt>はんだん</rt></ruby>をしたい。","Tôi muốn đưa ra đánh giá chắc chắn dựa trên kinh nghiệm.","<b>Chú ý:</b> Căn cứ khách quan để hành động, đánh giá."],
["N / V る + にしたがって","① tuân theo, theo đúng ② càng… càng…","<ruby>暑<rt>あつ</rt></ruby>くなるにしたがって、やる<ruby>気<rt>き</rt></ruby>がなくなってくる。","Càng nóng thì càng mất động lực.","<b>Chú ý:</b> 2 nghĩa: ① 'tuân theo' (quy tắc) ② 'càng… càng…' (thay đổi tương ứng)."],
["V る / V た / N の + 際(に・は)","Khi…","<ruby>受験<rt>じゅけん</rt></ruby>の<ruby>際<rt>さい</rt></ruby>は、<ruby>必<rt>かなら</rt></ruby>ず<ruby>受験票<rt>じゅけんひょう</rt></ruby>が<ruby>必要<rt>ひつよう</rt></ruby>になる。","Khi dự thi thì nhất định cần có phiếu dự thi.","<b>Chú ý:</b> Dùng cho dịp trang trọng (thi cử, lễ nghi). Không dùng cho việc thường ngày."],
["N / V る + に際して・に際し","Khi, nhân dịp ~","<ruby>日本語能力試験<rt>にほんごのうりょくしけん</rt></ruby>の<ruby>受験<rt>じゅけん</rt></ruby>に<ruby>際<rt>さい</rt></ruby>して、<ruby>注意<rt>ちゅうい</rt></ruby>すべき<ruby>点<rt>てん</rt></ruby>が<ruby>三<rt>みっ</rt></ruby>つあります。","Nhân dịp dự thi kỳ thi năng lực tiếng Nhật, có ba điểm cần lưu ý.","<b>Chú ý:</b> Giống 際に nhưng trang trọng hơn, dùng trong văn bản chính thức."],
["V る / N + にあたって","Khi / Nhân dịp…","<ruby>日本<rt>にほん</rt></ruby>で<ruby>会談<rt>かいだん</rt></ruby>を<ruby>行<rt>おこな</rt></ruby>うにあたって、<ruby>警備<rt>けいび</rt></ruby>を<ruby>強化<rt>きょうか</rt></ruby>する。","Nhân dịp tổ chức hội đàm tại Nhật Bản, an ninh sẽ được tăng cường.","<b>Chú ý:</b> Dùng cho sự kiện lớn, có sự chuẩn bị."],
["N + にそって","① Dựa theo ② Dọc theo…","<ruby>花火大会<rt>はなびたいかい</rt></ruby>の<ruby>日<rt>ひ</rt></ruby>は、<ruby>大勢<rt>おおぜい</rt></ruby>の<ruby>人<rt>ひと</rt></ruby>が<ruby>土手<rt>どて</rt></ruby>にそって<ruby>座<rt>すわ</rt></ruby>っている。","Ngày hội pháo hoa, rất đông người ngồi dọc theo bờ đê.","<b>Chú ý:</b> 2 nghĩa: ① 'dựa theo' (yêu cầu, ý kiến) ② 'dọc theo' (vị trí)."],
["N / V る + に伴って / に伴い","① cùng với… ② vì… nên kèm theo đó…","<ruby>大学進学<rt>だいがくしんがく</rt></ruby>にともない<ruby>東京<rt>とうきょう</rt></ruby>に<ruby>引<rt>ひ</rt></ruby>っ<ruby>越<rt>こ</rt></ruby>した。","Cùng với việc vào đại học, tôi đã chuyển đến Tokyo.","<b>Chú ý:</b> 2 nghĩa: ① 'cùng với…' (thay đổi đồng thời) ② 'nhân…' (kèm theo)."],
["N + にかけては","Riêng về mặt…, lĩnh vực…","<ruby>料理<rt>りょうり</rt></ruby>の<ruby>腕前<rt>うでまえ</rt></ruby>にかけては<ruby>自信<rt>じしん</rt></ruby>があります。","Riêng về tài nấu nướng thì tôi rất tự tin.","<b>Chú ý:</b> Khẳng định sự tự tin, vượt trội ở một lĩnh vực cụ thể."],
["V(普) / N + にしては","Vậy mà…","<ruby>彼女<rt>かのじょ</rt></ruby>、<ruby>健康<rt>けんこう</rt></ruby>に<ruby>気<rt>き</rt></ruby>をつかっているにしてはよく<ruby>風邪<rt>かぜ</rt></ruby>を<ruby>引<rt>ひ</rt></ruby>くね。","Cô ấy vậy mà hay bị cảm dù rất chú ý giữ gìn sức khỏe.","<b>Chú ý:</b> Kết quả trái với đánh giá từ vế trước."],
["普通形 + にしても","Giả sử, cứ cho là… thì…","3<ruby>時<rt>じ</rt></ruby>に<ruby>家<rt>いえ</rt></ruby>を<ruby>出<rt>で</rt></ruby>るにしても5<ruby>時<rt>じ</rt></ruby>までに<ruby>空港<rt>くうこう</rt></ruby>に<ruby>到着<rt>とうちゃく</rt></ruby>するのは<ruby>困難<rt>こんなん</rt></ruby>だ。","Giả sử cho là 3 giờ ra khỏi nhà thì việc đến sân bay trước 5 giờ cũng khó.","<b>Chú ý:</b> Đưa ra giả định rồi đánh giá kết quả."],
["普通形 + (に)もかまわず","Mặc kệ… / Chẳng màng…","<ruby>彼<rt>かれ</rt></ruby>は<ruby>人目<rt>ひとめ</rt></ruby>もかまわず、<ruby>道<rt>みち</rt></ruby>で<ruby>歌<rt>うた</rt></ruby>っている。","Anh ấy mặc kệ ánh mắt người đời, hát nghêu ngao giữa đường.","<b>Chú ý:</b> Bất chấp sự phản đối, ánh nhìn của người khác."],
["N + を込めて","Chất chứa… / Dồn cả…","<ruby>愛<rt>あい</rt></ruby>を<ruby>込<rt>こ</rt></ruby>めて<ruby>作<rt>つく</rt></ruby>ったチョコレートを<ruby>彼<rt>かれ</rt></ruby>に<ruby>渡<rt>わた</rt></ruby>した。","Tôi đã trao cho anh ấy thanh sô cô la được làm với tất cả tình yêu.","<b>Chú ý:</b> Diễn tả tình cảm, tâm huyết đặt vào hành động."],
["N + をぬきにして(は)","Nếu mà không… thì khó có thể…","この<ruby>仕事<rt>しごと</rt></ruby>は<ruby>社長<rt>しゃちょう</rt></ruby>をぬきにしては<ruby>決<rt>き</rt></ruby>められない。","Công việc này nếu không có giám đốc thì không thể quyết định được.","<b>Chú ý:</b> Nhấn mạnh vai trò không thể thiếu của N."],
["N + を問わず","Bất kể…","インターネットがあれば<ruby>場所<rt>ばしょ</rt></ruby>を<ruby>問<rt>と</rt></ruby>わずに、<ruby>仕事<rt>しごと</rt></ruby>ができる。","Chỉ cần có internet thì ở đâu cũng làm việc được, bất kể địa điểm.","<b>Chú ý:</b> Không phân biệt điều kiện, đối tượng."],
["N + をはじめ(として)","Điều đầu tiên kể đến là… / Đặc biệt là…","<ruby>彼<rt>かれ</rt></ruby>は<ruby>英語<rt>えいご</rt></ruby>をはじめ、<ruby>中国語<rt>ちゅうごくご</rt></ruby>やフランス<ruby>語<rt>ご</rt></ruby>など5か<ruby>国語<rt>こくご</rt></ruby>を<ruby>話<rt>はな</rt></ruby>せる。","Anh ấy nói được 5 thứ tiếng, đặc biệt là tiếng Anh, tiếng Trung, tiếng Pháp...","<b>Chú ý:</b> Liệt kê với ví dụ tiêu biểu nhất đứng đầu."],
["N + をめぐって","Xoay xung quanh…","<ruby>祖父<rt>そふ</rt></ruby>の<ruby>遺産<rt>いさん</rt></ruby>をめぐって、<ruby>父<rt>ちち</rt></ruby>とおじは<ruby>対立<rt>たいりつ</rt></ruby>している。","Bố tôi và chú đang mâu thuẫn xoay quanh di sản của ông nội.","<b>Chú ý:</b> Dùng cho tranh cãi, thảo luận về một vấn đề."],
["N + のもとで","Dưới / Dựa vào / Nhờ vào…","<ruby>弟<rt>おとうと</rt></ruby>は<ruby>有名<rt>ゆうめい</rt></ruby>な<ruby>建築家<rt>けんちくか</rt></ruby>のもとで3<ruby>年間<rt>ねんかん</rt></ruby><ruby>修行<rt>しゅぎょう</rt></ruby>を<ruby>積<rt>つ</rt></ruby>んだ。","Em trai tôi đã tu nghiệp 3 năm dưới trướng một kiến trúc sư nổi tiếng.","<b>Chú ý:</b> Chịu sự ảnh hưởng, chỉ đạo, bảo trợ của ai/cái gì."],
["普通形 + のみならず","Không chỉ… mà còn / mà ngay cả…","この<ruby>商品<rt>しょうひん</rt></ruby>は<ruby>安<rt>やす</rt></ruby>いのみならず<ruby>質<rt>しつ</rt></ruby>もいいので、<ruby>多<rt>おお</rt></ruby>くの<ruby>人<rt>ひと</rt></ruby>に<ruby>購入<rt>こうにゅう</rt></ruby>されている。","Sản phẩm này không chỉ rẻ mà chất lượng cũng tốt nên được nhiều người mua.","<b>Chú ý:</b> Trang trọng hơn だけでなく."],
["N + はもとより","N là đương nhiên, … cũng… / Không chỉ… mà còn…","<ruby>大学院<rt>だいがくいん</rt></ruby>に<ruby>進学<rt>しんがく</rt></ruby>することは、<ruby>父<rt>ちち</rt></ruby>はもとより<ruby>母<rt>はは</rt></ruby>も<ruby>賛成<rt>さんせい</rt></ruby>だ。","Việc học lên cao học thì bố đã đành, ngay cả mẹ cũng tán thành.","<b>Chú ý:</b> Mở rộng từ điều hiển nhiên sang điều bất ngờ hơn."],
["N + はともかく(として)","Khoan bàn, nói đến…","あの<ruby>店<rt>みせ</rt></ruby>の<ruby>料理<rt>りょうり</rt></ruby>は<ruby>見<rt>み</rt></ruby>た<ruby>目<rt>め</rt></ruby>はともかく、<ruby>値段<rt>ねだん</rt></ruby>が<ruby>安<rt>やす</rt></ruby>く<ruby>味<rt>あじ</rt></ruby>がいいと<ruby>評判<rt>ひょうばん</rt></ruby>だ。","Khoan bàn về hình thức, món ăn quán đó được tiếng là rẻ mà ngon.","<b>Chú ý:</b> Tạm gác một khía cạnh để nói về khía cạnh khác."],
["N + はさておき","Chưa nói đến, khoan nói đến, tạm bỏ qua một bên…","<ruby>事件<rt>じけん</rt></ruby>のきっかけはさておき、けが<ruby>人<rt>にん</rt></ruby>がいなくて<ruby>本当<rt>ほんとう</rt></ruby>に<ruby>良<rt>よ</rt></ruby>かった。","Tạm bỏ qua nguyên nhân vụ việc, thật may là không có ai bị thương.","<b>Chú ý:</b> Giống はともかく: tạm bỏ qua một chuyện để nói chuyện khác."],
["普通形 + からには / 以上(は) / 上は","Một khi mà đã… / Vì… nên đương nhiên là…","<ruby>会社<rt>かいしゃ</rt></ruby>の<ruby>社長<rt>しゃちょう</rt></ruby>であるからには、<ruby>従業員<rt>じゅうぎょういん</rt></ruby>に<ruby>尊敬<rt>そんけい</rt></ruby>される<ruby>存在<rt>そんざい</rt></ruby>でいなくてはならないと<ruby>思<rt>おも</rt></ruby>う。","Một khi đã là giám đốc công ty thì phải là người được nhân viên kính trọng.","<b>Chú ý:</b> Nhấn mạnh trách nhiệm, nghĩa vụ. Vế sau thường là べき / なければならない."],
["N + からいって / からいうと / からいえば","Xét từ phương diện… mà nói…","<ruby>見<rt>み</rt></ruby>た<ruby>目<rt>め</rt></ruby>からいうと、<ruby>山田<rt>やまだ</rt></ruby>さんよりも<ruby>田中<rt>たなか</rt></ruby>さんのほうがお<ruby>金<rt>かね</rt></ruby><ruby>持<rt>も</rt></ruby>ちであると<ruby>思<rt>おも</rt></ruby>う。","Xét về vẻ bề ngoài mà nói thì tôi nghĩ anh Tanaka giàu hơn anh Yamada.","<b>Chú ý:</b> Đưa ra đánh giá dựa trên một khía cạnh cụ thể."],
["N + からすると / からすれば","Đứng từ (vị trí)… mà nói thì…","<ruby>彼<rt>かれ</rt></ruby>の<ruby>日本語<rt>にほんご</rt></ruby>の<ruby>発音<rt>はつおん</rt></ruby>からすると、<ruby>韓国人<rt>かんこくじん</rt></ruby>だと<ruby>推測<rt>すいそく</rt></ruby>している。","Nhìn từ cách phát âm tiếng Nhật của anh ấy mà nói thì tôi đoán anh ấy là người Hàn Quốc.","<b>Chú ý:</b> Suy đoán dựa trên căn cứ quan sát được."],
["N + からして","Xét từ góc độ… / Ngay cả, ngay từ…","<ruby>雰囲気<rt>ふんいき</rt></ruby>からして、<ruby>彼女<rt>かのじょ</rt></ruby>はただ<ruby>者<rt>もの</rt></ruby>じゃないぞ。","Xét từ khí chất mà nói thì cô ấy không phải người tầm thường đâu.","<b>Chú ý:</b> Đánh giá tổng thể từ ấn tượng ban đầu, hoặc nhấn mạnh 'ngay từ…'."],
["普通形 + とは","(Thì thật là…)","まさか<ruby>私<rt>わたし</rt></ruby>の<ruby>犬<rt>いぬ</rt></ruby>がその<ruby>人<rt>ひと</rt></ruby>の<ruby>手<rt>て</rt></ruby>にかみついたとは、<ruby>信<rt>しん</rt></ruby>じられなかった。","Tôi không thể tin được là con chó của tôi lại cắn vào tay người đó.","<b>Chú ý:</b> Cảm thán bất ngờ 'lại…!', thường là chuyện khó tin. Hay đi với まさか."],
["N1(や・とか)N2 + といった N","Ví dụ như… / Chẳng hạn như…","<ruby>焼肉<rt>やきにく</rt></ruby>や<ruby>牛丼<rt>ぎゅうどん</rt></ruby>といったお<ruby>肉料理<rt>にくりょうり</rt></ruby>が<ruby>大好<rt>だいす</rt></ruby>きだ。","Tôi rất thích các món thịt như thịt nướng hay cơm bò.","<b>Chú ý:</b> Liệt kê ví dụ tiêu biểu cho danh từ đứng sau."],
["普通形 + としても","Cho dù là… / Thậm chí nếu là…","たとえきれいだとしても、<ruby>性格<rt>せいかく</rt></ruby>が<ruby>悪<rt>わる</rt></ruby>ければ<ruby>付<rt>つ</rt></ruby>き<ruby>合<rt>あ</rt></ruby>おうとは<ruby>思<rt>おも</rt></ruby>わない。","Cho dù có xinh đẹp thì nếu tính cách xấu tôi cũng không muốn hẹn hò.","<b>Chú ý:</b> Nhượng bộ giả định. Hay đi với たとえ."],
["V る / N / A い + とともに","① Cùng với ② càng… càng…","<ruby>季節<rt>きせつ</rt></ruby>の<ruby>変化<rt>へんか</rt></ruby>とともに<ruby>木<rt>き</rt></ruby>の<ruby>葉<rt>は</rt></ruby>の<ruby>色<rt>いろ</rt></ruby>も<ruby>変<rt>か</rt></ruby>わる。","Cùng với sự thay đổi của mùa, màu lá cây cũng thay đổi.","<b>Chú ý:</b> 2 nghĩa: ① 'cùng với' (đồng hành) ② 'càng… càng…' (thay đổi đồng thời)."],
["普通形 + としたら","Giả sử nếu mà… / Giả dụ như…","<ruby>宝<rt>たから</rt></ruby>くじが<ruby>当<rt>あ</rt></ruby>たったとしたら、<ruby>家族<rt>かぞく</rt></ruby>に<ruby>海外旅行<rt>かいがいりょこう</rt></ruby>をプレゼントしたい。","Giả dụ mà trúng xổ số thì tôi muốn tặng gia đình một chuyến du lịch nước ngoài.","<b>Chú ý:</b> Giả định chuyện không có thật."],
["N + といったら","Nói về…","<ruby>山<rt>やま</rt></ruby>の<ruby>頂上<rt>ちょうじょう</rt></ruby>からの<ruby>景色<rt>けしき</rt></ruby>といったら、<ruby>美<rt>うつく</rt></ruby>しすぎて<ruby>言葉<rt>ことば</rt></ruby>にならないくらいだった。","Nói về cảnh đẹp từ đỉnh núi thì đẹp đến mức không thể diễn tả bằng lời.","<b>Chú ý:</b> Nhấn mạnh chủ đề rồi đưa ra đánh giá rất cao."],
["普通形 + ということだ","Có nghĩa là, tóm lại là, tức là…","<ruby>彼<rt>かれ</rt></ruby>は<ruby>昨日<rt>きのう</rt></ruby>も<ruby>今日<rt>きょう</rt></ruby>も<ruby>練習<rt>れんしゅう</rt></ruby>を<ruby>休<rt>やす</rt></ruby>んでいる。<ruby>最初<rt>さいしょ</rt></ruby>からやる<ruby>気<rt>き</rt></ruby>がなかったということだ。","Anh ấy hôm qua và hôm nay đều nghỉ tập. Tức là ngay từ đầu đã không có động lực.","<b>Chú ý:</b> Đưa ra kết luận, suy ra từ các sự việc đã nêu trước đó."],
["V(普) + のなんのって","Cực kì, rất…","<ruby>彼<rt>かれ</rt></ruby>はアメリカに3<ruby>年<rt>ねん</rt></ruby><ruby>住<rt>す</rt></ruby>んでいるが、<ruby>英語<rt>えいご</rt></ruby>が<ruby>下手<rt>へた</rt></ruby>なのなんのって。","Anh ấy sống ở Mỹ 3 năm mà tiếng Anh thì dở tệ.","<b>Chú ý:</b> Nhấn mạnh mức độ cực đoan. Văn nói thân mật."],
["V(普)/A い さ/み + のあまり","Vì quá…","<ruby>忙<rt>いそが</rt></ruby>しさのあまり、<ruby>食事<rt>しょくじ</rt></ruby>をすることを<ruby>忘<rt>わす</rt></ruby>れてしまっていた。","Vì quá bận mà tôi quên cả việc ăn uống.","<b>Chú ý:</b> Nguyên nhân là cảm xúc, trạng thái quá mức dẫn đến hành động ngoài ý muốn."],
["A いくて + ならない","Rất… đến mức không kìm nén được","この<ruby>道<rt>みち</rt></ruby>は<ruby>街灯<rt>がいとう</rt></ruby>がなく、<ruby>辺<rt>あた</rt></ruby>りが<ruby>見<rt>み</rt></ruby>えにくいので<ruby>危<rt>あぶ</rt></ruby>なくてならない。","Con đường này không có đèn đường, xung quanh khó nhìn nên nguy hiểm vô cùng.","<b>Chú ý:</b> Cảm xúc mạnh tự nhiên trào ra, không kìm được. Chỉ dùng cho cảm xúc, không dùng cho hành động có ý chí."],
["A いくて / A なで + たまらない","Rất… đến mức không chịu được","ホラー<ruby>映画<rt>えいが</rt></ruby>を<ruby>観<rt>み</rt></ruby>てから、トイレが<ruby>怖<rt>こわ</rt></ruby>くてたまらない。","Từ khi xem phim kinh dị, tôi sợ đi vệ sinh đến mức không chịu nổi.","<b>Chú ý:</b> Mức độ mạnh hơn てならない, diễn tả cảm xúc, khó chịu tột độ."],
["V ます + 得る","Có khả năng… / Có thể…","どんなに<ruby>優秀<rt>ゆうしゅう</rt></ruby>な<ruby>人<rt>ひと</rt></ruby>でも、<ruby>間違<rt>まちが</rt></ruby>いを<ruby>起<rt>お</rt></ruby>こすことは<ruby>有<rt>あ</rt></ruby>り<ruby>得<rt>う</rt></ruby>る。","Dù là người xuất sắc đến đâu thì cũng có thể mắc sai lầm.","<b>Chú ý:</b> Khả năng xảy ra của sự việc. Văn viết. Khác với ことができる (khả năng chung của con người)."],
["V る V る / A1 やら / N1 やら","Vừa… vừa… / Nào là… nào là…","<ruby>母<rt>はは</rt></ruby>はいつも、<ruby>掃除<rt>そうじ</rt></ruby>をするやら<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>に<ruby>行<rt>い</rt></ruby>くやら<ruby>忙<rt>いそが</rt></ruby>しい。","Mẹ tôi lúc nào cũng bận rộn nào là dọn dẹp nào là đi mua sắm.","<b>Chú ý:</b> Liệt kê ví dụ không hết, mang sắc thái văn nói, hơi than phiền."],
["N1 も V ば N2 も","Cả N1, N2 đều…","<ruby>私<rt>わたし</rt></ruby>は<ruby>勉強<rt>べんきょう</rt></ruby>も<ruby>苦手<rt>にがて</rt></ruby>なら、<ruby>運動<rt>うんどう</rt></ruby>も<ruby>苦手<rt>にがて</rt></ruby>で<ruby>自分<rt>じぶん</rt></ruby>のことが<ruby>嫌<rt>いや</rt></ruby>になる。","Tôi học cũng dở mà thể thao cũng dở, đến mức ghét cả bản thân mình.","<b>Chú ý:</b> Liệt kê hai điều cùng tính chất, cùng mức độ."],
["V る / N の + 上で","Khi, trong trường hợp","<ruby>外国人<rt>がいこくじん</rt></ruby>との<ruby>交流<rt>こうりゅう</rt></ruby>の<ruby>上<rt>うえ</rt></ruby>で<ruby>重要<rt>じゅうよう</rt></ruby>なのは、<ruby>相手<rt>あいて</rt></ruby>の<ruby>文化<rt>ぶんか</rt></ruby>を<ruby>知<rt>し</rt></ruby>ろうとすることだ。","Trong giao lưu với người nước ngoài, điều quan trọng là cố gắng hiểu văn hóa của đối phương.","<b>Chú ý:</b> Nêu bối cảnh, điều kiện để đánh giá, nhận định."],
["V た / N の + 上で","Sau khi…","SNSで<ruby>何度<rt>なんど</rt></ruby>もやり<ruby>取<rt>と</rt></ruby>りをした<ruby>上<rt>うえ</rt></ruby>で、<ruby>彼<rt>かれ</rt></ruby>と<ruby>実際<rt>じっさい</rt></ruby>に<ruby>会<rt>あ</rt></ruby>うことに<ruby>決<rt>き</rt></ruby>めた。","Sau khi trao đổi nhiều lần trên mạng xã hội, tôi đã quyết định gặp anh ấy ngoài đời.","<b>Chú ý:</b> Nhấn mạnh đã hoàn thành vế trước rồi mới làm vế sau."],
["V ます + 次第","Ngay sau khi…","<ruby>準備<rt>じゅんび</rt></ruby>が<ruby>整<rt>ととの</rt></ruby>い<ruby>次第<rt>しだい</rt></ruby>、すぐに<ruby>作業<rt>さぎょう</rt></ruby>に<ruby>移<rt>うつ</rt></ruby>る。","Ngay sau khi chuẩn bị xong sẽ bắt tay vào công việc ngay.","<b>Chú ý:</b> Vế trước hoàn thành thì vế sau xảy ra ngay lập tức."],
["N + 次第だ / で / では","① Tùy vào ② Thế nên là…","<ruby>明日<rt>あした</rt></ruby>の<ruby>天気<rt>てんき</rt></ruby><ruby>次第<rt>しだい</rt></ruby>でどこにデートで<ruby>行<rt>い</rt></ruby>くかが<ruby>決<rt>き</rt></ruby>まる。","Tùy vào thời tiết ngày mai mà quyết định đi hẹn hò ở đâu.","<b>Chú ý:</b> 2 nghĩa: ① 'tùy vào…' ② 'là vì…' (giải thích hoàn cảnh, văn viết)."],
["V た / N の + あげく","Kết cục thì… / Cuối cùng thì…","<ruby>日々<rt>ひび</rt></ruby>の<ruby>重労働<rt>じゅうろうどう</rt></ruby>のあげく、<ruby>上司<rt>じょうし</rt></ruby>は<ruby>病気<rt>びょうき</rt></ruby>にかかり<ruby>入院<rt>にゅういん</rt></ruby>することとなった。","Kết cục là sau những ngày lao động nặng nhọc triền miên, sếp đã đổ bệnh phải nhập viện.","<b>Chú ý:</b> Kết quả XẤU sau một quá trình dài. Luôn mang nghĩa tiêu cực. Đừng nhầm với 末 (có thể trung tính)."],
["V た / N の + 末(に)","Cuối cùng thì… / Kết quả là…","<ruby>大<rt>おお</rt></ruby>げんかの<ruby>末<rt>すえ</rt></ruby>にその<ruby>夫婦<rt>ふうふ</rt></ruby>は<ruby>離婚<rt>りこん</rt></ruby>した。","Cuối cùng sau một trận cãi nhau lớn, cặp vợ chồng đó đã ly hôn.","<b>Chú ý:</b> Kết quả sau một quá trình. Có thể trung tính hơn あげく (luôn tiêu cực)."],
["N / V る / V ている + どころではない","Không phải trong hoàn cảnh để có thể…","<ruby>年末年始<rt>ねんまつねんし</rt></ruby>は<ruby>忙<rt>いそが</rt></ruby>しいので、ゆっくりしているどころではない。","Cuối năm đầu năm bận rộn nên không phải lúc để thong thả nghỉ ngơi.","<b>Chú ý:</b> Phủ nhận khả năng vì hoàn cảnh không cho phép."],
["V る / V ない / N の + おそれがある","E rằng… / Có khả năng…","<ruby>今晩<rt>こんばん</rt></ruby>は<ruby>大雨<rt>おおあめ</rt></ruby>のおそれがある。","Tối nay e rằng sẽ có mưa lớn.","<b>Chú ý:</b> Dự báo nguy cơ xấu. Thường dùng trong dự báo thời tiết, cảnh báo thiên tai."],
["V て + はじめて","Kể từ sau khi… thì mới… / Chỉ sau khi… mới…","この<ruby>本<rt>ほん</rt></ruby>を3<ruby>回<rt>かい</rt></ruby><ruby>読<rt>よ</rt></ruby>んではじめて、<ruby>内容<rt>ないよう</rt></ruby>を<ruby>理解<rt>りかい</rt></ruby>する<ruby>事<rt>こと</rt></ruby>ができた。","Chỉ sau khi đọc cuốn sách này 3 lần tôi mới hiểu được nội dung.","<b>Chú ý:</b> Nhấn mạnh phải trải qua vế trước mới đạt được vế sau."],
["V た + きり / っきり","Kể từ sau khi…","<ruby>父<rt>ちち</rt></ruby>とは5<ruby>年前<rt>ねんまえ</rt></ruby>に<ruby>会<rt>あ</rt></ruby>ったきり、<ruby>連絡<rt>れんらく</rt></ruby>を<ruby>取<rt>と</rt></ruby>っていない。","Kể từ lần gặp bố cách đây 5 năm, tôi không còn liên lạc nữa.","<b>Chú ý:</b> Trạng thái kéo dài từ một thời điểm trong quá khứ, thường mang nghĩa tiêu cực (không còn…)."],
["N(の) / V る + に先立って","Trước khi…","<ruby>大学進学<rt>だいがくしんがく</rt></ruby>に<ruby>先立<rt>さきだ</rt></ruby>って、<ruby>弟<rt>おとうと</rt></ruby>は<ruby>東京<rt>とうきょう</rt></ruby>に<ruby>引<rt>ひ</rt></ruby>っ<ruby>越<rt>こ</rt></ruby>しをした。","Trước khi vào đại học, em trai tôi đã chuyển đến Tokyo.","<b>Chú ý:</b> Trang trọng, dùng cho sự kiện chính thức."],
["V た + ところ","Sau khi…","<ruby>日本人<rt>にほんじん</rt></ruby>に<ruby>聞<rt>き</rt></ruby>いたところ、<ruby>私<rt>わたし</rt></ruby>の<ruby>発音<rt>はつおん</rt></ruby>は<ruby>間違<rt>まちが</rt></ruby>っていたようだ。","Sau khi hỏi người Nhật thì có vẻ phát âm của tôi đã sai.","<b>Chú ý:</b> Kết quả thu được từ hành động tìm hiểu, hỏi han."],
["V(普)/A い(普)/A な(である)/N(である) + どころか","Chẳng những / thậm chí…","このゲームは<ruby>子供<rt>こども</rt></ruby>どころか、<ruby>大人<rt>おとな</rt></ruby>まで<ruby>夢中<rt>むちゅう</rt></ruby>になってしまう。","Trò chơi này đừng nói là trẻ con, đến người lớn còn mê mẩn.","<b>Chú ý:</b> Phủ định kỳ vọng ban đầu rồi đưa ra mức độ cao hơn, bất ngờ hơn."],
["V る / V ない / V ている + ようじゃ / ようでは","Nếu… như thế này thì…","<ruby>小<rt>ちい</rt></ruby>さい<ruby>事<rt>こと</rt></ruby>を<ruby>気<rt>き</rt></ruby>にしているようでは、おおらかな<ruby>人<rt>ひと</rt></ruby>にはなれない。","Nếu cứ để ý những chuyện nhỏ nhặt như thế này thì không thể trở thành người rộng lượng được.","<b>Chú ý:</b> Phê phán thái độ, hành động hiện tại của ai đó."],
["V ます / A い / A な / であり + ながら(も)","Mặc dù… nhưng…","<ruby>彼<rt>かれ</rt></ruby>は<ruby>新人<rt>しんじん</rt></ruby>でありながら、<ruby>態度<rt>たいど</rt></ruby>が<ruby>良<rt>よ</rt></ruby>くないので<ruby>注意<rt>ちゅうい</rt></ruby>をする。","Dù là người mới nhưng thái độ của anh ấy không tốt nên tôi phải nhắc nhở.","<b>Chú ý:</b> Hai mặt đối lập cùng tồn tại. Trang trọng hơn のに."],
["V ます + つつ","Vừa… vừa…","<ruby>煙草<rt>たばこ</rt></ruby>は<ruby>健康<rt>けんこう</rt></ruby>に<ruby>良<rt>よ</rt></ruby>くないと<ruby>分<rt>わ</rt></ruby>かりつつ、<ruby>禁煙<rt>きんえん</rt></ruby>する<ruby>事<rt>こと</rt></ruby>ができない。","Biết thuốc lá không tốt cho sức khỏe mà tôi vẫn không bỏ được.","<b>Chú ý:</b> = ながら 'vừa… vừa…', dùng trong văn viết. Hai hành động diễn ra đồng thời."],
["V 普 / A い + わりに(は)","Mặc dù… / So với… thì…","この<ruby>仕事<rt>しごと</rt></ruby>は<ruby>大変<rt>たいへん</rt></ruby>なわりに<ruby>給料<rt>きゅうりょう</rt></ruby>が<ruby>安<rt>やす</rt></ruby>いので、<ruby>辞<rt>や</rt></ruby>めようか<ruby>悩<rt>なや</rt></ruby>んでいる。","Công việc này vất vả vậy mà lương lại thấp nên tôi đang phân vân có nên nghỉ không.","<b>Chú ý:</b> So với tiêu chuẩn thông thường thì kết quả thấp hơn kỳ vọng."],
["普通形 + 一方(で)","Ngược lại với… / Một mặt thì… / Mặt khác…","<ruby>彼<rt>かれ</rt></ruby>は<ruby>音楽家<rt>おんがくか</rt></ruby>である<ruby>一方<rt>いっぽう</rt></ruby>、<ruby>画家<rt>がか</rt></ruby>としても<ruby>活躍<rt>かつやく</rt></ruby>している。","Anh ấy một mặt là nhạc sĩ, mặt khác còn hoạt động tích cực với tư cách họa sĩ.","<b>Chú ý:</b> Hai mặt đối lập hoặc bổ sung cho nhau."],
["V る + 一方だ / ばかりだ","Càng ngày càng… / Có xu hướng…","<ruby>薬<rt>くすり</rt></ruby>を<ruby>飲<rt>の</rt></ruby>み<ruby>休<rt>やす</rt></ruby>んでいるが、<ruby>病状<rt>びょうじょう</rt></ruby>は<ruby>悪<rt>わる</rt></ruby>くなるばかりだ。","Dù đã uống thuốc và nghỉ ngơi nhưng bệnh tình ngày càng nặng thêm.","<b>Chú ý:</b> Xu hướng một chiều, thường là tiêu cực."],
["V ます + つつある","Đang dần… / Đang ngày càng…","<ruby>日本<rt>にほん</rt></ruby>に<ruby>観光<rt>かんこう</rt></ruby>に<ruby>訪<rt>おとず</rt></ruby>れる<ruby>外国<rt>がいこく</rt></ruby>の<ruby>方<rt>かた</rt></ruby>が、<ruby>年々<rt>ねんねん</rt></ruby><ruby>増<rt>ふ</rt></ruby>えつつある。","Số du khách nước ngoài đến tham quan Nhật Bản đang tăng dần qua từng năm.","<b>Chú ý:</b> Quá trình thay đổi đang diễn ra. Văn viết trang trọng."],
["V ない + ざるをえない","Buộc phải, đành phải ~","<ruby>急<rt>きゅう</rt></ruby>な<ruby>用事<rt>ようじ</rt></ruby>が<ruby>入<rt>はい</rt></ruby>ったため、<ruby>夜<rt>よる</rt></ruby>の<ruby>飲<rt>の</rt></ruby>み<ruby>会<rt>かい</rt></ruby>は<ruby>断<rt>ことわ</rt></ruby>らざるをえない。","Vì có việc đột xuất nên tôi đành phải từ chối buổi nhậu tối nay.","<b>Chú ý:</b> Bị hoàn cảnh ép buộc, mang sắc thái miễn cưỡng. = なければならない nhưng nhấn mạnh sự bất đắc dĩ."],
["V る / V ない + わけにはいかない","Không thể nào mà lại… / Buộc phải…","テストが<ruby>控<rt>ひか</rt></ruby>えているから、<ruby>勉強<rt>べんきょう</rt></ruby>をしないわけにはいかない。","Vì sắp đến kỳ kiểm tra nên tôi buộc phải học.","<b>Chú ý:</b> Bị ràng buộc bởi lý do khách quan. Khác ざるをえない ở sắc thái: cái này thiên về 'không thể không làm'."],
["V る + よりほかない","Chỉ còn cách…","<ruby>試験<rt>しけん</rt></ruby>に<ruby>合格<rt>ごうかく</rt></ruby>したいなら<ruby>死<rt>し</rt></ruby>ぬ<ruby>気<rt>き</rt></ruby>で<ruby>勉強<rt>べんきょう</rt></ruby>するよりほかないよ。","Nếu muốn đỗ kỳ thi thì chỉ còn cách học với quyết tâm cao độ thôi.","<b>Chú ý:</b> Không còn lựa chọn nào khác."],
["V 意向形 + ではないか","(Kêu gọi) chúng ta hãy…","<ruby>今<rt>いま</rt></ruby>のままでは<ruby>何<rt>なに</rt></ruby>も<ruby>決<rt>き</rt></ruby>まらない。<ruby>一度<rt>いちど</rt></ruby>じっくり<ruby>話<rt>はな</rt></ruby>し<ruby>合<rt>あ</rt></ruby>ってみようではないか。","Cứ thế này thì chẳng quyết định được gì. Chúng ta hãy thử bàn bạc kỹ một lần đi.","<b>Chú ý:</b> Kêu gọi hành động chung. Mạnh mẽ, trang trọng hơn ましょう."],
["N + にほかならない","Chắc chắn là… / Chỉ có thể là… / Không gì khác ngoài…","JLPTに<ruby>合格<rt>ごうかく</rt></ruby>できたのは、<ruby>彼<rt>かれ</rt></ruby>の<ruby>努力<rt>どりょく</rt></ruby>の<ruby>成果<rt>せいか</rt></ruby>にほかならない。","Việc đỗ JLPT chắc chắn là thành quả nỗ lực của anh ấy, không gì khác.","<b>Chú ý:</b> Khẳng định tuyệt đối về nguyên nhân, bản chất."],
["V て + はいられない","Không thể nào mà… thêm nữa","<ruby>試験<rt>しけん</rt></ruby>も<ruby>近<rt>ちか</rt></ruby>いので、<ruby>遊<rt>あそ</rt></ruby>んではいられません。","Kỳ thi cũng sắp đến rồi nên không thể cứ mãi chơi được.","<b>Chú ý:</b> Cảm thấy không thể tiếp tục duy trì trạng thái hiện tại, cần phải hành động."]
];
var S=window.hatchWidget.getState({i:0,f:false,known:[],order:null});
if(!S.order){S.order=CARDS.map(function(_,i){return i;});window.hatchWidget.setState(S);}
function idx(){return S.order[S.i];}
function render(){
var c=CARDS[idx()];
var b=document.getElementById("fcBody");
if(!S.f){b.innerHTML='<div class="fc-front">'+c[0]+'</div>';document.getElementById("fcHint").textContent="Nhìn mẫu ngữ pháp, tự nhớ nghĩa trước khi lật";}
else{b.innerHTML='<div class="fc-mean">'+c[1]+'</div><div class="fc-lbl">例文</div><div class="fc-ex">'+c[2]+'</div><div class="fc-lbl">DỊCH SÁT NGHĨA</div><div class="fc-vn">'+c[3]+'</div><div class="fc-note">⚠ '+c[4]+'</div>';document.getElementById("fcHint").textContent="Tự kiểm tra: mình có nhớ đúng không?"}
document.getElementById("fcCount").textContent="Thẻ "+(S.i+1)+" / "+CARDS.length;
document.getElementById("fcKnown").textContent="Đã thuộc: "+S.known.length;
document.getElementById("fcBar").style.width=Math.round(S.known.length/CARDS.length*100)+"%";
}
function flip(){S.f=!S.f;window.hatchWidget.setState(S);render();}
function go(d){S.i=(S.i+d+CARDS.length)%CARDS.length;S.f=false;window.hatchWidget.setState(S);render();}
function mark(ok){var id=idx();var k=S.known.indexOf(id);if(ok&&k<0)S.known.push(id);if(!ok&&k>=0)S.known.splice(k,1);go(1);}
function shuffle(){for(var i=S.order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=S.order[i];S.order[i]=S.order[j];S.order[j]=t;}S.i=0;S.f=false;window.hatchWidget.setState(S);render();}
window.addEventListener("hatch-widget-state",function(e){S=e.detail.state;render();});
document.getElementById("fcFlip").onclick=flip;
document.getElementById("fcCard").onclick=flip;
document.getElementById("fcPrev").onclick=function(){go(-1);};
document.getElementById("fcNext").onclick=function(){go(1);};
document.getElementById("fcEasy").onclick=function(){mark(true);};
document.getElementById("fcHard").onclick=function(){mark(false);};
document.getElementById("fcShuffle").onclick=shuffle;
render();
</script>
